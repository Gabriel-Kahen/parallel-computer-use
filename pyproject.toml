[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "local-computer-use"
version = "0.1.0"
description = "Coordinate local AI workers in private Linux desktop sessions."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
codex-auth = ["PyJWT[crypto]>=2.10.1,<3"]

[project.scripts]
local-computer-use = "local_computer_use.__main__:main"

[tool.setuptools]
packages = ["local_computer_use"]

[tool.setuptools.package-data]
local_computer_use = ["static/*.html", "static/*.css", "static/*.js", "fixtures/*"]
